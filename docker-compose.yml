services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cvrag-db
    environment:
      POSTGRES_USER: cvrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cvrag
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
